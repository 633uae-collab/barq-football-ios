name: TestFlight access preflight
on:
  workflow_dispatch:
  push:
    branches: [codex/premium-cinematic, codex/fotiq-rider-reference]
    paths: [ci/testflight-preflight.mjs, .github/workflows/testflight-preflight.yml]
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Check App Store Connect access without uploading
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node ci/testflight-preflight.mjs

  stop-unrequested-simulator-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel automatic legacy runs during device-preview transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN in 43023190472 43023190222; do
            gh api --method POST "repos/${{ github.repository }}/actions/runs/$RUN/cancel" || true
          done
