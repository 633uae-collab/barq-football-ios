name: Core AX recorded replay (not live acceptance)
on:
  workflow_dispatch:
  push:
    branches: [codex/core-stability]
    paths:
      - .github/workflows/core-ax-diagnostic.yml
      - BARQUITests/AnalystAccessibilityUITests.swift
      - ci/fixtures/analyst-ax-recorded.json
      - ci/run-bounded-core.py
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Intel run 42772782700 never reached the app: first-boot migration
        # exceeded the bounded preflight. Continue the isolated AX experiment
        # on the runner that completed boot; do not increase that deadline.
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: fotiq-live-provider-review
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode and simulator for environment comparison
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          mkdir -p out
          xcodebuild -version | tee out/xcode-version.txt
          uname -m | tee out/architecture.txt
          sw_vers | tee out/host-version.txt
          printf '%s\n' "$GITHUB_SHA" > out/head-sha.txt
          brew install xcodegen
          xcodegen generate
          xcrun simctl list devices available -j > out/devices.json
          UDID=$(python3 -c 'import json; d=json.load(open("out/devices.json"))["devices"]; print(next(v["udid"] for k,vs in d.items() if k.endswith("iOS-26-2") for v in vs if v["name"] == "iPhone 16 Pro"))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          printf '%s\n' "$UDID" > out/requested-udid.txt
          xcrun simctl boot "$UDID" || true
          python3 ci/run-bounded-core.py 120 xcrun simctl bootstatus "$UDID" -b
      - name: Build chat diagnostic without entry tests
        run: |
          set -o pipefail
          python3 ci/run-bounded-core.py 900 xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee out/build.log
      - name: Install recorded transcript in the disposable simulator
        run: |
          APP=$(find dd/Build/Products -name BARQ.app -path '*iphonesimulator*' | head -1)
          test -n "$APP"
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" ae.barq.football data)
          mkdir -p "$CONTAINER/Library/Application Support"
          cp ci/fixtures/analyst-ax-recorded.json "$CONTAINER/Library/Application Support/analyst-conversations.json"
          echo "CHAT_CONTAINER=$CONTAINER" >> "$GITHUB_ENV"
          shasum -a 256 ci/fixtures/analyst-ax-recorded.json > out/fixture-sha256.txt
          printf '%s\n' 'Recorded response from run 42720959954, artifact 13722121995. Diagnostic replay only; no live answer or accuracy claim.' > out/evidence-kind.txt
      - name: Ten drafts and AX snapshots against recorded content
        run: |
          set -o pipefail
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "ae.barq.transport" OR subsystem == "ae.barq.composer"' >out/transport.log 2>&1 &
          LOG_PID=$!
          tail -n +1 -F out/transport.log &
          TAIL_PID=$!
          python3 -u ci/core-host-health.py out/host-health.jsonl &
          HEALTH_PID=$!
          trap 'kill "$LOG_PID" "$TAIL_PID" "$HEALTH_PID" 2>/dev/null || true' EXIT
          python3 ci/run-bounded-core.py 900 xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -parallel-testing-enabled NO -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/AnalystAccessibilityUITests -resultBundlePath replay.xcresult 2>&1 | tee out/replay.log
      - name: Preserve archive and verify no diagnostic sends
        if: always()
        run: |
          if [ -n "$CHAT_CONTAINER" ]; then
            # XCTest may reinstall the app and relocate its data container.
            # Resolve it again after execution instead of retaining the install path.
            CURRENT_CONTAINER=$(xcrun simctl get_app_container "$UDID" ae.barq.football data)
            cp "$CURRENT_CONTAINER/Library/Application Support/analyst-conversations.json" out/archive-after.json
            python3 -c 'import json; a=json.load(open("ci/fixtures/analyst-ax-recorded.json")); b=json.load(open("out/archive-after.json")); assert a == b, "Recorded archive changed during no-send replay"'
            sed -n 's/^FOTIQ_AX_REPLAY actualUDID=//p' out/replay.log | head -1 > out/actual-udid.txt
            cmp out/requested-udid.txt out/actual-udid.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-ax-replay-${{ matrix.runner }}
          path: |
            out/
            replay.xcresult
          retention-days: 14
