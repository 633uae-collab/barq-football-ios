name: Core app acceptance (iOS 26)
on:
  workflow_dispatch:
  push:
    branches: [codex/core-stability]
    paths:
      - BARQ/Views/AnalystChatView.swift
      - BARQ/Core/AnalystChat.swift
      - BARQ/Core/AnalystConversations.swift
      - BARQ/Core/API.swift
      - BARQUITests/AnalystConversationUITests.swift
      - BARQUITests/ScoreAssociationUITests.swift
      - ci/core-acceptance-request.txt
permissions:
  contents: read
jobs:
  core-functions:
    concurrency:
      group: fotiq-live-provider-review
      cancel-in-progress: false
    # Standard Intel runner: free for this public repository; ARM capacity is unavailable.
    # Keep the existing boot bounds, acceptance assertions and entry-test exclusions.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reserve time for evidence before the hard job limit
        run: |
          mkdir -p out
          printf '%s\n' "$GITHUB_SHA" > out/head-sha.txt
          python3 -c 'import time; print("FOTIQ_CORE_DEADLINE_EPOCH=" + str(time.time() + 3000))' >> "$GITHUB_ENV"
      - name: Recorder protocol checks
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build UI tests
        id: ui_build
        run: |
          set -o pipefail
          python3 ci/run-core-command.py 900 xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "generic/platform=iOS Simulator" ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee build-ui.log
      - name: Select and boot simulator after compilation
        run: |
          mkdir -p out
          set -o pipefail
          python3 ci/run-core-command.py 120 xcrun simctl list devices available -j > out/devices.json 2>out/simulator-list.log
          UDID=$(python3 -c 'import json; d=json.load(open("out/devices.json"))["devices"]; print(next(v["udid"] for k,vs in d.items() if k.endswith("iOS-26-2") for v in vs if v["name"] == "iPhone 16 Pro"))')
          uname -m > out/architecture.txt
          printf '%s\n' "$UDID" > out/requested-udid.txt
          echo "UDID=$UDID" >> $GITHUB_ENV
          # Match the successful 592df02 AX replay preflight: boot only.
          # Appearance/touch overlays/Simulator.app belong to the separate video pass.
          # Run 42791306277 booted successfully but simctl ui timed out before tests.
          python3 ci/run-core-command.py 120 xcrun simctl boot "$UDID" 2>&1 | tee out/simulator-boot.log || true
      - name: Verify simulator readiness after compilation
        id: simulator_ready
        run: |
          set -o pipefail
          # Build independently of CoreSimulator device discovery.
          # Keep the same readiness deadline and require success before UI tests.
          python3 ci/run-core-command.py 120 xcrun simctl bootstatus "$UDID" -b 2>&1 | tee out/simulator-bootstatus.log
      - name: Core unit tests (entry tests excluded)
        run: |
          set -o pipefail
          python3 ci/run-core-command.py 900 xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test -skip-testing:BARQTests/OnboardingTests -skip-testing:BARQTests/P0OnboardingTests -skip-testing:BARQTests/LaunchJourneyTests -skip-testing:BARQTests/PremiumExperienceTests/testBrandMarkHasTransparentMatteAndPreservesOriginalColors -skip-testing:BARQTests/PremiumExperienceTests/testLaunchClockUsesElapsedTimeWithoutFrameClamp -skip-testing:BARQTests/PremiumExperienceTests/testLaunchClockDoesNotConsumeTransitionWhileDestinationIsPreparing -skip-testing:BARQTests/PremiumExperienceTests/testStaticLaunchKeepsOriginalSizeAndUsesOnlyOpacity -skip-testing:BARQTests/PremiumExperienceTests/testRiderRevealCoversAllCornersThenContractsMonotonically -skip-testing:BARQTests/PremiumExperienceTests/testRiderMarkErasesBeforeTheFieldContractsAndPulseClearsAtEnd -resultBundlePath unit.xcresult 2>&1 | tee unit.log
      - name: Preserve unit evidence before UI work
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: core-unit-evidence
          path: |
            out/head-sha.txt
            unit.log
            unit.xcresult
          retention-days: 14
      - name: Verify simulator resource signature before launch
        run: |
          # iOS 26 SplashBoard rejected unsealed launch resources with -67056
          # (run42614519822). Xcode now signs locally without a paid identity.
          APP=$(find dd/Build/Products -name BARQ.app -path '*iphonesimulator*' | head -1)
          test -n "$APP"
          test -f "$APP/_CodeSignature/CodeResources"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Real welcome does not send a chat message
        run: |
          set -o pipefail
          mkdir -p out
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "ae.barq.transport" OR subsystem == "ae.barq.composer"' >out/welcome-transport.log 2>&1 &
          WELCOME_LOG_PID=$!
          tail -n +1 -F out/welcome-transport.log &
          WELCOME_TAIL_PID=$!
          python3 -u ci/core-host-health.py out/welcome-host-health.jsonl &
          WELCOME_HEALTH_PID=$!
          trap 'kill "$WELCOME_LOG_PID" "$WELCOME_TAIL_PID" "$WELCOME_HEALTH_PID" 2>/dev/null || true' EXIT
          python3 ci/run-core-command.py 900 xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -parallel-testing-enabled NO -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/AnalystConversationUITests/testLiveWelcomeRemainsOutsideTheConversation -resultBundlePath welcome.xcresult 2>&1 | tee out/welcome.log
      - name: Preserve welcome evidence before conversation
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: core-welcome-evidence
          path: |
            out/
            build-ui.log
            welcome.xcresult
          retention-days: 14
      - name: Real conversation, follow-ups and restoration
        id: conversation
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' && steps.simulator_ready.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p out
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "ae.barq.transport" OR subsystem == "ae.barq.composer"' >out/transport-codes.log 2>&1 &
          TRANSPORT_LOG_PID=$!
          # Keep diagnostic progress in the hosted job log even if final upload fails.
          tail -n +1 -F out/transport-codes.log &
          COMPOSER_TAIL_PID=$!
          python3 -u ci/core-host-health.py out/host-health.jsonl &
          HOST_HEALTH_PID=$!
          # Functional acceptance must not depend on video capture.
          # Recording is a separate evidence pass after functional acceptance.
          stop_diagnostics() { kill "$HOST_HEALTH_PID" "$COMPOSER_TAIL_PID" "$TRANSPORT_LOG_PID" 2>/dev/null || true; }
          trap stop_diagnostics EXIT
          python3 ci/run-core-command.py 1800 xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -parallel-testing-enabled NO -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/AnalystConversationUITests/testRealBilingualFollowUpsAndConversationRestoration -resultBundlePath conversation.xcresult 2>&1 | tee out/conversation.log
      - name: Collect conversation evidence before another simulator test
        if: always()
        run: |
          mkdir -p out/screenshots
          cp /tmp/fotiq-conversation-shots/* out/screenshots/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > out/head-sha.txt
      - name: Preserve conversation evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: core-conversation-evidence
          path: |
            out/
            conversation.xcresult
          retention-days: 14
      - name: Real bilingual score association and saved match
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' && steps.simulator_ready.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p out
          python3 ci/run-core-command.py 900 xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -parallel-testing-enabled NO -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/ScoreAssociationUITests -resultBundlePath scores.xcresult 2>&1 | tee out/scores.log
      - name: Collect actual evidence
        if: always()
        run: |
          mkdir -p out/screenshots
          cp /tmp/fotiq-conversation-shots/* out/screenshots/ 2>/dev/null || true
          cp /tmp/fotiq-launch-shots/score-* out/screenshots/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > out/head-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-functions-evidence
          path: |
            out/
            unit.log
            build-ui.log
            conversation.xcresult
            welcome.xcresult
            scores.xcresult
          retention-days: 14
