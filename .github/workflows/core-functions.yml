name: Core app acceptance (iOS 26)
on:
  workflow_dispatch:
  push:
    branches: [codex/core-stability]
    paths:
      - BARQ/Views/AnalystChatView.swift
      - BARQ/Core/AnalystChat.swift
      - BARQ/Core/AnalystConversations.swift
      - BARQ/Core/API.swift
      - BARQUITests/AnalystConversationUITests.swift
      - BARQUITests/ScoreAssociationUITests.swift
      - ci/core-acceptance-request.txt
permissions:
  contents: read
jobs:
  core-functions:
    concurrency:
      group: fotiq-live-provider-review
      cancel-in-progress: false
    # The macos-26 jobs were cancelled before any steps in both attempts.
    # Use the Xcode 26 Intel runner that completed native validation 42687173166.
    # Assertions, provider spacing and timeouts remain unchanged.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recorder protocol checks
        run: python3 -m unittest discover -s ci/tests -p 'test_record_core.py'
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen ffmpeg && xcodegen generate
      - name: Pick simulator, enable touch indicators, boot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys;d=json.load(sys.stdin)['devices']
          c=[x for k,v in sorted(d.items(),reverse=True) if 'iOS-26' in k for x in v if 'iPhone' in x['name']]
          p=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']] or c
          print(p[0]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          defaults write com.apple.iphonesimulator ShowSingleTouches 1
          defaults write com.apple.iphonesimulator ShowPinches 1
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
      - name: Core unit tests (entry tests excluded)
        run: |
          set -o pipefail
          xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test -skip-testing:BARQTests/LaunchJourneyTests -skip-testing:BARQTests/PremiumExperienceTests/testBrandMarkHasTransparentMatteAndPreservesOriginalColors -skip-testing:BARQTests/PremiumExperienceTests/testLaunchClockUsesElapsedTimeWithoutFrameClamp -skip-testing:BARQTests/PremiumExperienceTests/testLaunchClockDoesNotConsumeTransitionWhileDestinationIsPreparing -skip-testing:BARQTests/PremiumExperienceTests/testStaticLaunchKeepsOriginalSizeAndUsesOnlyOpacity -skip-testing:BARQTests/PremiumExperienceTests/testRiderRevealCoversAllCornersThenContractsMonotonically -skip-testing:BARQTests/PremiumExperienceTests/testRiderMarkErasesBeforeTheFieldContractsAndPulseClearsAtEnd -resultBundlePath unit.xcresult 2>&1 | tee unit.log
      - name: Build UI tests
        id: ui_build
        run: |
          set -o pipefail
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee build-ui.log
      - name: Verify simulator resource signature before launch
        run: |
          # iOS 26 SplashBoard rejected unsealed launch resources with -67056
          # (run42614519822). Xcode now signs locally without a paid identity.
          APP=$(find dd/Build/Products -name BARQ.app -path '*iphonesimulator*' | head -1)
          test -n "$APP"
          test -f "$APP/_CodeSignature/CodeResources"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Real welcome does not send a chat message
        run: |
          set -o pipefail
          mkdir -p out
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "ae.barq.transport" OR subsystem == "ae.barq.composer"' >out/welcome-transport.log 2>&1 &
          WELCOME_LOG_PID=$!
          tail -n +1 -F out/welcome-transport.log &
          WELCOME_TAIL_PID=$!
          python3 -u ci/core-host-health.py out/welcome-host-health.jsonl &
          WELCOME_HEALTH_PID=$!
          trap 'kill "$WELCOME_LOG_PID" "$WELCOME_TAIL_PID" "$WELCOME_HEALTH_PID" 2>/dev/null || true' EXIT
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/AnalystConversationUITests/testLiveWelcomeRemainsOutsideTheConversation -resultBundlePath welcome.xcresult 2>&1 | tee out/welcome.log
      - name: Real conversation, follow-ups and restoration
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p out
          mkdir -p /tmp/fotiq-core-recording
          python3 ci/record-core.py out/video --prepare "$UDID"
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "ae.barq.transport" OR subsystem == "ae.barq.composer"' >out/transport-codes.log 2>&1 &
          TRANSPORT_LOG_PID=$!
          # Keep diagnostic progress in the hosted job log even if final upload fails.
          tail -n +1 -F out/transport-codes.log &
          COMPOSER_TAIL_PID=$!
          python3 -u ci/core-host-health.py out/host-health.jsonl &
          HOST_HEALTH_PID=$!
          # Recording starts only after the test confirms the analyst is ready.
          # The test supplies its real simulator UDID and stops capture before relaunch.
          touch /tmp/fotiq-core-recording/enabled
          python3 ci/record-core.py out/video &
          RECORDING_PID=$!
          stop_diagnostics() { kill "$HOST_HEALTH_PID" "$COMPOSER_TAIL_PID" 2>/dev/null || true; kill "$TRANSPORT_LOG_PID" 2>/dev/null || true; kill "$RECORDING_PID" 2>/dev/null || true; wait "$RECORDING_PID" 2>/dev/null || true; }
          trap stop_diagnostics EXIT
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/AnalystConversationUITests/testRealBilingualFollowUpsAndConversationRestoration -resultBundlePath conversation.xcresult 2>&1 | tee out/conversation.log
      - name: Real bilingual score association and saved match
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building -only-testing:BARQUITests/ScoreAssociationUITests -resultBundlePath scores.xcresult 2>&1 | tee out/scores.log
      - name: Collect actual evidence
        if: always()
        run: |
          mkdir -p out/screenshots
          cp /tmp/fotiq-conversation-shots/* out/screenshots/ 2>/dev/null || true
          cp /tmp/fotiq-launch-shots/score-* out/screenshots/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > out/head-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-functions-evidence
          path: |
            out/
            unit.log
            build-ui.log
            conversation.xcresult
            welcome.xcresult
            scores.xcresult
          retention-days: 14


