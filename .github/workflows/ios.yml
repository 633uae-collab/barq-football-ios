name: iOS build
on:
  push:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode with iOS 26 SDK
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on runner"; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
          xcodebuild -showsdks | grep -q iphonesimulator26 || { echo "::error::iOS 26 simulator SDK missing"; exit 1; }
      - run: brew install xcodegen && xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS-26' in k for x in v if 'iPhone' in x['name']))")
          echo "UDID=$UDID" >> $GITHUB_ENV
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Unit tests
        run: xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO test 2>&1 | tail -40
      - name: Screenshots
        run: |
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
          APP=$(find dd/Build/Products -name BARQ.app -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance dark
          shot() { xcrun simctl terminate "$UDID" ae.barq.football 2>/dev/null || true; xcrun simctl launch "$UDID" ae.barq.football "${@:2}"; sleep 22; xcrun simctl io "$UDID" screenshot "shots/v2-$1.png"; }
          mkdir -p shots
          API=$(curl -s https://koora-ae.surge.sh/config.json | python3 -c "import json,sys;print(json.load(sys.stdin)['api'])")
          MID=$(curl -s -H "X-Pinggy-No-Screen: 1" "$API/api/fixtures" | python3 -c "import json,sys;f=json.load(sys.stdin)['fixtures'];L={'1H','2H','HT'};f=sorted(f,key=lambda x:(x['status']['short'] not in L,-(x.get('imp') or 0)));print(f[0]['id'])" || echo 0)
          echo "match $MID"
          shot home
          shot matches -startTab matches
          shot match-center -openMatch "$MID"
          shot ai -startTab ai
          shot favorites -startTab favorites
          shot search -startTab search
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screens, path: shots, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log, if-no-files-found: ignore }
      - name: Zip unsigned app
        run: cd dd/Build/Products/Debug-iphonesimulator && zip -qr ../../../../BARQ-sim.zip BARQ.app
      - uses: actions/upload-artifact@v4
        with: { name: BARQ-simulator-app, path: BARQ-sim.zip }

  # Disabled until an Apple Developer account ($99/yr) exists. Needs secrets:
  # APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key), plus app record in App Store Connect.
  testflight:
    if: false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > key.p8
          xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -configuration Release -destination generic/platform=iOS -archivePath BARQ.xcarchive archive DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} -allowProvisioningUpdates -authenticationKeyPath $PWD/key.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
          xcrun altool --upload-package BARQ.xcarchive --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }} || true
