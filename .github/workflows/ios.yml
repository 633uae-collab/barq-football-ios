name: iOS build
on:
  push:
    # Cinematic branch records offline launch first. Dispatch this unchanged full suite
    # after PR4 live Groq acceptance finishes, to avoid competing for its free quota.
    branches-ignore: [codex/premium-cinematic]
  workflow_dispatch:
    inputs:
      runner: { description: "macOS runner label (macos-26-intel if arm queue is stuck)", required: false, default: "macos-26" }
      api_base: { description: "Optional FOTIQ backend base URL (else secret FOTIQ_API_BASE, else Render preview)", required: false, default: "" }
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --prefix server
      - run: npm test --prefix server

  simulator:
    concurrency:
      group: fotiq-live-provider-review
      cancel-in-progress: false
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 140
    env:
      FOTIQ_API_BASE: ${{ inputs.api_base || secrets.FOTIQ_API_BASE || 'https://barq-football-ios.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode with iOS 26 SDK
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on runner"; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
          xcodebuild -showsdks | grep -q iphonesimulator26 || { echo "::error::iOS 26 simulator SDK missing"; exit 1; }
      - run: brew install xcodegen && xcodegen generate
        timeout-minutes: 15
        env: { HOMEBREW_NO_AUTO_UPDATE: "1" }
      - name: Pick simulator (Pro model = has Dynamic Island)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys;d=json.load(sys.stdin)['devices']
          c=[x for k,v in sorted(d.items(),reverse=True) if 'iOS-26' in k for x in v if 'iPhone' in x['name']]
          p=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']] or c
          print(p[0]['udid']); print(p[0]['name'],file=sys.stderr)")
          echo "UDID=$UDID" >> $GITHUB_ENV
      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -destination "id=$UDID" -derivedDataPath dd FOTIQ_API_BASE="$FOTIQ_API_BASE" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          echo "Swift warnings in our sources:"; grep -E "/(BARQ|BARQWidgets|Shared|BARQTests)/.*warning:" build.log | sort -u | tee warnings.txt || true
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -destination "id=$UDID" -derivedDataPath dd FOTIQ_API_BASE="$FOTIQ_API_BASE" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | grep -E "Test Case|Executed|TEST (SUCCEEDED|FAILED)|error:" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: App bundle must not contain the API-SPORTS key or direct provider calls
        run: |
          APP=$(find dd/Build/Products -name BARQ.app -path "*iphonesimulator*" | head -1)
          if grep -rIl "x-apisports-key\|v3.football.api-sports.io" "$APP"; then echo "::error::provider key/host found in app bundle"; exit 1; fi
          strings "$APP/BARQ" | grep -iE "apisports-key|v3\.football" && exit 1 || echo "OK: no API key / provider host in app binary"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
      - name: Launch profile (xctrace Time Profiler + Animation Hitches) + splash timing log, screenshots only
        timeout-minutes: 15
        continue-on-error: true
        run: |
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b   # run 41718653710: "Unable to lookup in current state: Shutdown"
          APP=$(find dd/Build/Products -name "BARQ.app" -path "*iphonesimulator*" | head -1); xcrun simctl install "$UDID" "$APP"
          mkdir -p diag/trace
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'subsystem == "ae.barq.splash"' > diag/trace/launch-timing.log 2>&1 &
          LP=$!
          for T in "Time Profiler" "Animation Hitches"; do
            N=$(echo "$T" | tr -d ' ')
            ( xcrun xctrace record --template "$T" --device "$UDID" --time-limit 20s --output "diag/trace/$N.trace" \
              --env FOTIQ_UI_TEST=1 --launch -- "$APP" -lang ar -resetOnboarding YES > "diag/trace/$N.out" 2>&1 ) &
            XP=$!; sleep 45; kill -INT $XP 2>/dev/null || true
            sleep 15; kill -9 $XP 2>/dev/null || true
            pkill -9 -f "xctrace record" || true
            xcrun simctl io "$UDID" screenshot "diag/trace/$N-end.png" || true
            xcrun simctl terminate "$UDID" ae.barq.football || true
          done
          kill $LP || true
          xcrun xctrace export --input diag/trace/TimeProfiler.trace --toc > diag/trace/tp-toc.xml 2>&1 || true
          xcrun xctrace export --input diag/trace/TimeProfiler.trace --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' > diag/trace/tp.xml 2>&1 || true
          xcrun xctrace export --input diag/trace/AnimationHitches.trace --toc > diag/trace/ah-toc.xml 2>&1 || true
          ls -la diag/trace; du -sh diag/trace
      - name: UI tests (real backend data)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 50
        run: |
          set -o pipefail
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'subsystem == "ae.barq.splash"' > ui-app-timing.log 2>&1 &
          LGP=$!
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd FOTIQ_API_BASE="$FOTIQ_API_BASE" CODE_SIGNING_ALLOWED=NO test -resultBundlePath ui.xcresult -skip-testing:BARQUITests/LiveTimelineUITests -skip-testing:BARQUITests/HomeReviewUITests 2>&1 | tee uitest.log | grep -E "Test Case|CHAT_RESULT|HOMEV8|Executed|TEST (SUCCEEDED|FAILED)|error:" || true
          mkdir -p shots/onboarding; cp /tmp/onb-*.png shots/onboarding/ || true
          cp /tmp/fotiq-chat-results.txt shots/ || true
          cp /tmp/v7-chat-*.png shots/ || true
          kill $LGP || true; mkdir -p diag; cp ui-app-timing.log diag/ || true
          grep -q "TEST SUCCEEDED" uitest.log
          mkdir -p shots; cp /tmp/v7-*.png shots/ || true; cp /tmp/fotiq-springboard.png shots/v4-00-home-screen-icon.png || echo "no springboard capture"
      - name: Upload native chat evidence immediately after UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-chat-evidence
          path: |
            shots/fotiq-chat-results.txt
            shots/v7-chat-*.png
            uitest.log
          if-no-files-found: error
      - name: Home design review captures (screenshots only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd FOTIQ_API_BASE="$FOTIQ_API_BASE" CODE_SIGNING_ALLOWED=NO test -only-testing:BARQUITests/HomeReviewUITests 2>&1 | tee review.log | grep -E "Test Case|HOME_REVIEW|HOME_FULL|error:" || true
          mkdir -p shots/review; cp /tmp/review-home-*.png shots/review/ || true
          cp /tmp/review-home-extra-*-coverage.txt shots/review/ || true
          grep -q "TEST SUCCEEDED" review.log
      - name: Live timeline tests (live match now + replay of recorded real snapshots)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          API=$(node ci/resolve-api-base.mjs) || exit 1
          H="X-Pinggy-No-Screen: 1"
          get() { for i in 1 2 3 4; do API=$(node ci/resolve-api-base.mjs) || return 1; curl -sf -m 90 -H "$H" "$API$1" -o "$2" && return 0; sleep 15; done; return 1; }
          get /api/fixtures fx.json || echo '{"fixtures":[]}' > fx.json
          get /api/replay rp.json || echo '[]' > rp.json
          LIVE=$(python3 -c "
          import json;f=[x for x in json.load(open('fx.json'))['fixtures'] if x['status']['short'] in('1H','2H') and (x['status']['elapsed'] or 0)<80]
          f.sort(key=lambda x:-(x.get('imp') or 0)); print(f[0]['id'] if f else '')")
          REP=$(python3 -c "import json;r={x['id']:x['steps'] for x in json.load(open('rp.json'))};i=1490591 if 1490591 in r else (max(r,key=r.get) if r else None);print(i,r[i]) if i else print('')")
          echo "live=$LIVE replay=$REP" | tee live-ids.txt
          export TEST_RUNNER_LIVE_ID="$LIVE" TEST_RUNNER_LIVE_MINUTES=9 TEST_RUNNER_REPLAY_ID="${REP% *}" TEST_RUNNER_REPLAY_STEPS="${REP#* }" TEST_RUNNER_STOPPAGE_ID=1559185
          set -o pipefail
          xcodebuild -project BARQFootball.xcodeproj -scheme FOTIQUITests -destination "id=$UDID" -derivedDataPath dd FOTIQ_API_BASE="$FOTIQ_API_BASE" CODE_SIGNING_ALLOWED=NO test -only-testing:BARQUITests/LiveTimelineUITests 2>&1 | tee livetest.log | grep -E "Test Case|Executed|TEST (SUCCEEDED|FAILED)|error:|REPLAY_LOG|LIVE_LOG|STOPPAGE_ORDER|new=|scroll anchor|start:" || true
          mkdir -p shots; for f in /tmp/fotiq-*.png; do cp "$f" "shots/v6-$(basename $f .png | sed 's/fotiq-//').png"; done; cp live-ids.txt shots/
          grep -q "TEST SUCCEEDED" livetest.log
      - name: Screenshots of all 17 screens (real API-SPORTS data via backend)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
          APP=$(find dd/Build/Products -name BARQ.app -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p shots
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          mkdir -p shots
          API=$(node ci/resolve-api-base.mjs) || exit 1
          H="X-Pinggy-No-Screen: 1"
          MID=$(curl -s -H "$H" "$API/api/fixtures" | python3 -c "import json,sys;f=json.load(sys.stdin)['fixtures'];L={'1H','2H','HT','ET'};f=sorted(f,key=lambda x:(x['status']['short'] not in L,-(x.get('imp') or 0)));print(f[0]['id'])")
          TEAM=$(curl -s -H "$H" "$API/api/match/$MID" | python3 -c "import json,sys;print(json.load(sys.stdin)['match']['home']['id'])")
          PLAYER=$(curl -s -H "$H" "$API/api/topscorers/39" | python3 -c "import json,sys;print(json.load(sys.stdin)['players'][0]['id'])")
          echo "match=$MID team=$TEAM player=$PLAYER" | tee shots/ids.txt
          shot() { n=$1; shift; xcrun simctl terminate "$UDID" ae.barq.football 2>/dev/null || true; xcrun simctl launch "$UDID" ae.barq.football -qaFavTeam "$TEAM" "$@" >/dev/null; sleep 20; xcrun simctl io "$UDID" screenshot "shots/$( [[ $n == v5-* ]] && echo $n || echo v7-$n ).png"; }
          shot 01-home -screen home
          shot 02-matches -screen matches
          shot 03-calendar -screen calendar
          shot 04-month-picker -screen monthpicker
          shot 05-match-center -screen match -id "$MID"
          shot 06-match-preview -screen preview -id "$MID"
          shot 07-ai -screen ai
          shot 08-favorites -screen favorites
          shot 09-search -screen search -q "salah"
          shot 10-news -screen news
          shot 11-notifications -screen notifications
          shot 12-settings -screen settings
          shot 13-leagues -screen leagues
          shot 14-league-center -screen league -id 39
          shot 15-club -screen club -id 40
          shot 16-player -screen player -id "$PLAYER"
          shot 17-reorder -screen reorder
          shot 18-tabbar-root
          shot v5-timeline -screen timeline -id 1494795
          shot v5-timeline-en -screen timeline -id 1494795 -lang en
          shot v5-match-center-timeline -screen match -id 1494795
          shot 25-home-english -lang en
          shot 26-match-english -screen match -id "$MID" -lang en
          xcrun simctl ui "$UDID" appearance light
          shot 19-home-light -screen home -theme light
          shot 20-match-light -screen match -id "$MID" -theme light
          xcrun simctl ui "$UDID" appearance dark
          echo "MID=$MID" >> $GITHUB_ENV
      - name: Live Activity + Dynamic Island + notification on simulator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          set -x
          xcrun simctl privacy "$UDID" grant notifications ae.barq.football || echo "privacy grant notifications unsupported"
          xcrun simctl terminate "$UDID" ae.barq.football 2>/dev/null || true
          xcrun simctl launch --console-pty "$UDID" ae.barq.football -screen liveactivity -id "$MID" > shots/la-console.txt 2>&1 &
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/v4-21-liveactivity-app.png
          # Send the app to background so the Dynamic Island shows the activity
          xcrun simctl launch "$UDID" com.apple.Preferences; sleep 6
          xcrun simctl io "$UDID" screenshot shots/v4-22-dynamic-island.png
          # Live Activity update via simulated push (Xcode 26 simctl) - outcome recorded, not assumed
          xcrun simctl push "$UDID" ae.barq.football.push-type.liveactivity BARQTests/Payloads/live-update.json > shots/la-push.txt 2>&1; PUSH_RC=$?; echo "exit=$PUSH_RC" >> shots/la-push.txt
          sleep 5; xcrun simctl io "$UDID" screenshot shots/v4-23-dynamic-island-after-push.png
          # Regular APNs alert payload (from push.js) via simctl push
          xcrun simctl push "$UDID" ae.barq.football BARQTests/Payloads/alert.apns > shots/alert-push.txt 2>&1; PUSH_RC=$?; echo "exit=$PUSH_RC" >> shots/alert-push.txt
          sleep 3; xcrun simctl io "$UDID" screenshot shots/v4-24-notification-banner.png
          kill %1 2>/dev/null || true
          cat shots/la-console.txt shots/la-push.txt shots/alert-push.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screens, path: shots, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: "*.log", if-no-files-found: ignore }
      - name: Collect UI test result bundle + simulator crash reports
        if: always()
        run: |
          mkdir -p diag; cp -R ui.xcresult diag/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -name "BARQ*" -newer project.yml -exec cp {} diag/ \; 2>/dev/null || true
          ls -la diag
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-diagnostics, path: diag, if-no-files-found: ignore, retention-days: 7 }
      - name: Zip unsigned app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cd dd/Build/Products/Debug-iphonesimulator && zip -qr ../../../../BARQ-sim.zip BARQ.app
      - uses: actions/upload-artifact@v4
        with: { name: BARQ-simulator-app, path: BARQ-sim.zip }

  # TestFlight upload. Runs only when started manually AND the App Store Connect secrets exist,
  # so normal pushes stay green before the Apple Developer account is bought. Steps: docs/TESTFLIGHT.md
  testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FOTIQ_API_BASE: ${{ inputs.api_base || secrets.FOTIQ_API_BASE || 'https://barq-football-ios.onrender.com' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then echo "ok=true" >> $GITHUB_OUTPUT
          else echo "ok=false" >> $GITHUB_OUTPUT; echo "::notice::TestFlight skipped: App Store Connect secrets not set yet (see docs/TESTFLIGHT.md)"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - name: Archive + upload
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -eo pipefail
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$X"
          brew install xcodegen && xcodegen generate
          mkdir -p ~/private_keys; printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          KEY=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ci/ExportOptions.plist
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project BARQFootball.xcodeproj -scheme BARQ -configuration Release -destination generic/platform=iOS \
            -archivePath build/BARQ.xcarchive archive DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic \
            FOTIQ_API_BASE="$FOTIQ_API_BASE" CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH | tail -30
          xcodebuild -exportArchive -archivePath build/BARQ.xcarchive -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export $AUTH | tail -30
          rm -f "$KEY"
