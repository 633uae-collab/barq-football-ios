name: Extract original picker screenshots
on:
  push:
    branches: [codex/fotiq-rider-reference]
    paths: [.github/workflows/import-picker-pictures.yml]
permissions: {}
jobs:
  attach:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      FILMED_REVISION: 90d1049835b02b01bc21c6086499a3f57987aa66
      RUN_ID: '45532215622'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90d1049835b02b01bc21c6086499a3f57987aa66
          persist-credentials: false
      - name: Verify recording identity and original archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_path="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          test "$(gh api "$run_path" --jq .head_sha)" = "$FILMED_REVISION"
          for n in $(seq 1 90); do
            gh api "$run_path/artifacts?per_page=30" > artifacts.json
            id=$(jq -r '[.artifacts[]|select(.name=="club-selection-to-home" and .expired==false)][0].id // empty' artifacts.json)
            [[ -z "$id" ]] || break
            test "$(gh api "$run_path" --jq .status)" != completed
            sleep 20
          done
          test -n "$id"
          digest=$(jq -r --arg id "$id" '.artifacts[]|select((.id|tostring)==$id)|.digest' artifacts.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > evidence.zip
          echo "${digest#sha256:}  evidence.zip" | sha256sum -c -
      - name: Prepare image checks
        run: |
          python3 -m venv /tmp/check-images
          /tmp/check-images/bin/pip -q install pillow==11.3.0 opencv-python-headless==4.12.0.88
      - name: Validate and transfer only the onboarding captures as Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /tmp/check-images/bin/python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path
          
          import cv2
          import numpy as np
          from PIL import Image
          import sqlite3
          
          def send_blob(path):
              data = path.read_bytes()
              expected = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              payload = json.dumps({"encoding": "base64", "content": base64.b64encode(data).decode()})
              remote = subprocess.check_output(["gh","api","-X","POST","repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/blobs","--input","-","--jq",".sha"],input=payload.encode()).decode().strip()
              assert remote == expected
              print("PICTURE", path.name, expected, flush=True)
          
          with zipfile.ZipFile("evidence.zip") as archive:
              assert archive.read("head.txt").decode().strip() == os.environ["FILMED_REVISION"]
              chosen = json.loads(archive.read("selections.json"))
              assert chosen["onboardingDone"] and chosen["clubIDs"] == [529] and set(chosen["competitionIDs"]) == {2,140}
              for label in ["clubs","barcelona","leagues","cups"]:
                  data = archive.read(label+".png")
                  with Image.open(io.BytesIO(data)) as im:
                      im.load()
                      assert im.format == "PNG" and im.width > 1000 and im.height > im.width * 1.9
                  Path(label+".png").write_bytes(data)
                  send_blob(Path(label+".png"))
          
          with sqlite3.connect("BARQ/Resources/PickerCrests.sqlite") as db:
              def compare(label,kind,identity):
                  raw = db.execute("select image from crest where kind=? and id=?",(kind,identity)).fetchone()[0]
                  original = Image.open(io.BytesIO(raw)).convert("RGBA")
                  shot = np.array(Image.open(label+".png").convert("RGB"))
                  sh, sw = shot.shape[:2]
                  viewport = shot[int(.18*sh):int(.90*sh)]
                  best = (float("inf"),0,None)
                  for side in (round(sw*44/402)-2, round(sw*44/402), round(sw*44/402)+2):
                      im = original.resize((max(1,round(original.width*side/max(original.size))), max(1,round(original.height*side/max(original.size)))),Image.Resampling.LANCZOS)
                      a = np.array(im)
                      mask = np.uint8(a[:,:,3]>235)
                      if mask.sum()<100: continue
                      error = cv2.matchTemplate(viewport,a[:,:,:3].copy(),cv2.TM_SQDIFF,mask=mask)
                      value,_,pos,_ = cv2.minMaxLoc(error)
                      rmse=(max(0.,value)/(3*int(mask.sum())))**0.5
                      best=min(best,(rmse,side,pos))
                  print("ON_SCREEN",label,kind,identity,"RGB_RMSE",round(best[0],2),"scale",best[1],"at",best[2],flush=True)
                  return best[0]
              errors = [compare("clubs","teams",42),compare("barcelona","teams",529),compare("leagues","leagues",140),compare("cups","leagues",2)]
          panels=[]
          for label in ("clubs","leagues","cups"):
              with Image.open(label+".png") as im:
                  tile=im.convert("RGB");tile.thumbnail((260,600),Image.Resampling.LANCZOS);panels.append(tile)
          overview=Image.new("RGB",(sum(im.width for im in panels),max(im.height for im in panels)))
          x=0
          for im in panels:
              overview.paste(im,(x,0));x+=im.width
          overview.save("picker-preview.jpg",quality=83,optimize=True)
          send_blob(Path("picker-preview.jpg"))
          print("ARTWORK_MATCHES",sum(error < 32 for error in errors),"OF",len(errors))
          PY
